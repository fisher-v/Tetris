<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>俄罗斯方块</title>
    <link rel="stylesheet" href="src/styles.css?v=20260908-key-bindings" />
  </head>
  <body>
    <main class="game-shell" aria-label="俄罗斯方块游戏">
      <section class="handheld" aria-label="游戏机">
        <div class="brand-row">
          <span class="brand-light" aria-hidden="true"></span>
          <span class="brand-name">TETRIS POCKET</span>
        </div>

        <div class="screen-frame">
          <div class="screen">
            <div class="board-panel">
              <canvas id="board" width="360" height="600" aria-label="俄罗斯方块棋盘"></canvas>
              <div id="overlay" class="overlay">
                <div id="overlayTitle" class="overlay-title">俄罗斯方块</div>
                <button id="overlayButton" class="primary-button" type="button">开始游戏</button>
              </div>
            </div>

            <aside class="side-panel" aria-label="游戏信息">
              <div class="stat">
                <span>分数</span>
                <strong id="score">0</strong>
              </div>
              <div class="stat">
                <span>最高分</span>
                <strong id="bestScore">0</strong>
              </div>
              <div class="stat">
                <span>最近消行倍率</span>
                <strong id="multiplier">×1</strong>
              </div>
              <div class="stat">
                <span>状态</span>
                <strong id="statusText">待开始</strong>
              </div>
              <div class="next-box">
                <span>下一个</span>
                <canvas id="next" width="112" height="112" aria-label="下一个方块预览"></canvas>
              </div>
              <div class="desktop-actions">
                <button id="pauseButton" class="secondary-button" type="button">暂停</button>
                <button id="restartButton" class="secondary-button" type="button">重新开始</button>
                <button id="keySettingsButton" class="secondary-button" type="button">自定义按键</button>
              </div>
              <p id="helpText" class="help-text"></p>
            </aside>
          </div>
        </div>

        <div class="mobile-controls" aria-label="手机操作区">
          <div class="dpad" aria-label="方向键">
            <button class="control key-w" data-action="up" type="button" aria-label="W 上，无功能">W</button>
            <button class="control key-a" data-action="left" type="button" aria-label="A 左移">A</button>
            <button class="control key-s" data-action="down" type="button" aria-label="S 加速下落">S</button>
            <button class="control key-d" data-action="right" type="button" aria-label="D 右移">D</button>
          </div>
          <div class="action-pad" aria-label="操作键">
            <button class="round-control rotate-control" data-action="rotate" type="button">变形</button>
            <button class="round-control hard-control" data-action="hardDrop" type="button">速降</button>
          </div>
        </div>
      </section>

      <div id="keySettings" class="key-settings hidden" role="dialog" aria-modal="true" aria-labelledby="keySettingsTitle">
        <section class="key-settings-panel">
          <div class="key-settings-header">
            <div>
              <h2 id="keySettingsTitle">自定义按键</h2>
              <p>点击右侧按键项，再按下要绑定的键。每个键只能绑定一个功能。</p>
            </div>
            <button id="closeKeySettingsButton" class="close-button" type="button" aria-label="关闭自定义按键">×</button>
          </div>

          <div class="key-binding-list">
            <div class="key-binding-row"><span>左移</span><button class="key-binding" data-key-binding="left" type="button"></button></div>
            <div class="key-binding-row"><span>右移</span><button class="key-binding" data-key-binding="right" type="button"></button></div>
            <div class="key-binding-row"><span>加速下落</span><button class="key-binding" data-key-binding="down" type="button"></button></div>
            <div class="key-binding-row"><span>变形</span><button class="key-binding" data-key-binding="rotate" type="button"></button></div>
            <div class="key-binding-row"><span>速降</span><button class="key-binding" data-key-binding="hardDrop" type="button"></button></div>
            <div class="key-binding-row"><span>暂停 / 继续</span><button class="key-binding" data-key-binding="pause" type="button"></button></div>
            <div class="key-binding-row"><span>重新开始</span><button class="key-binding" data-key-binding="restart" type="button"></button></div>
          </div>

          <p id="keyBindingStatus" class="key-binding-status" role="status" aria-live="polite"></p>
          <div class="key-settings-actions">
            <button id="resetKeyBindingsButton" class="secondary-button" type="button">恢复默认</button>
            <button id="closeKeySettingsButtonBottom" class="primary-button" type="button">完成</button>
          </div>
        </section>
      </div>
    </main>

    <script src="src/tetris.js?v=20260908-line-multiplier"></script>
    <script src="src/app.js?v=20260908-line-multiplier"></script>
  </body>
</html>
